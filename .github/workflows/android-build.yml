name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android shell
        run: |
          flutter create . --platforms=android --org com.docmind --project-name docmind --empty
          rm -f test/widget_test.dart
      - name: Apply DocMind branding
        run: |
          python - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          text = text.replace('android:label="docmind"', 'android:label="DocMind"')
          manifest.write_text(text)
          PY
          mkdir -p .brand
          curl -fL --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/The-Null-Catchers/brand-assets/main/projects/docmind/icons/icon-512.png" \
            -o .brand/docmind-icon.png
      - name: Install dependencies
        run: flutter pub get
      - name: Generate launcher icons
        run: dart run flutter_launcher_icons
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Build release AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docmind-android-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
