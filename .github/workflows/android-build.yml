name: Android Build
on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android shell
        run: |
          flutter create . --platforms=android --org com.docmind --project-name docmind --empty
          rm -f test/widget_test.dart
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build release APK
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: Build release AAB
        run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: docmind-android-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
