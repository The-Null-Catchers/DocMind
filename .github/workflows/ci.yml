name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api}}
    env:
      DATABASE_URL: sqlite:///./ci.sqlite3
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /tmp/docmind-storage
      APP_SECRET: ci-only-secret
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - name: Validate fresh migrations
        env:
          DATABASE_URL: sqlite:///./migration-ci.sqlite3
        run: |
          rm -f migration-ci.sqlite3
          alembic upgrade head
          alembic current
      - run: python -m compileall -q app
      - name: Critical Python lint
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Full Python lint report
        run: ruff check app tests --exit-zero
      - name: Python typecheck
        run: mypy app --ignore-missing-imports
      - run: pytest
      - name: RAG evaluation
        working-directory: ${{ github.workspace }}
        run: python scripts/evaluate_rag.py

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate native platform shells
        run: |
          flutter create . --platforms=android,ios --org com.docmind --project-name docmind --empty
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Apply DocMind branding
        working-directory: ${{ github.workspace }}
        run: python scripts/apply_mobile_branding.py
      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: docmind-android-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f Dockerfile.api -t docmind-api:ci .
      - name: Build worker image
        run: docker build -f Dockerfile.worker -t docmind-worker:ci .
      - name: Build web image
        run: docker build -f Dockerfile.web --build-arg NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1 -t docmind-web:ci .
      - name: Validate Docker Compose stack
        run: |
          cp .env.example .env
          docker compose up -d --build postgres redis minio minio-init api worker web
          for attempt in {1..60}; do
            if curl -fsS http://localhost:8000/ready >/tmp/docmind-ready.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/docmind-ready.json
          curl -fsS http://localhost:8000/ready
          curl -fsS http://localhost:3000 >/dev/null
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install browser E2E runner
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npm install --no-save --package-lock=false @playwright/test@1.51.1
          npx playwright install --with-deps chromium
      - name: Run critical browser E2E
        working-directory: apps/web
        env:
          WEB_BASE_URL: http://localhost:3000
          API_BASE_URL: http://localhost:8000/api/v1
        run: npx playwright test
      - name: Show Compose logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=250
      - name: Stop Compose stack
        if: always()
        run: docker compose down -v
