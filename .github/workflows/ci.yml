name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: services/api}}
    env:
      DATABASE_URL: sqlite:///./ci.sqlite3
      STORAGE_BACKEND: local
      STORAGE_LOCAL_DIR: /tmp/docmind-storage
      APP_SECRET: ci-only-secret
      LLM_PROVIDER: mock
      EMBEDDING_PROVIDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -e '.[dev]'
      - name: Validate fresh migrations
        env:
          DATABASE_URL: sqlite:///./migration-ci.sqlite3
        run: |
          rm -f migration-ci.sqlite3
          alembic upgrade head
          alembic current
      - run: python -m compileall -q app
      - name: Critical Python lint
        run: ruff check app tests --select E9,F63,F7,F82
      - name: Full Python lint report
        run: ruff check app tests --exit-zero
      - name: Python typecheck
        run: mypy app --ignore-missing-imports
      - run: pytest
      - name: RAG evaluation
        working-directory: ${{ github.workspace }}
        run: python scripts/evaluate_rag.py

  web:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: apps/mobile}}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: {channel: stable, cache: true}
      - name: Generate native platform shells
        run: |
          flutter create . --platforms=android,ios --org com.docmind --project-name docmind --empty
          rm -f test/widget_test.dart
      - run: flutter pub get
      - name: Apply Dart formatter in CI
        run: dart format lib test
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - run: flutter build apk --release --build-number=${{ github.run_number }}
      - run: flutter build appbundle --release --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: docmind-android-release-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
