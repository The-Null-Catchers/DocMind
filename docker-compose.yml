services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: docmind
      POSTGRES_USER: docmind
      POSTGRES_PASSWORD: docmind
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U docmind"], interval: 5s, timeout: 3s, retries: 20}

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: [redis_data:/data]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 20}

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: docmind
      MINIO_ROOT_PASSWORD: docmind-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio_data:/data]

  minio-init:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 docmind docmind-dev-secret;
      mc mb -p local/docmind || true; mc anonymous set private local/docmind; exit 0;"

  api:
    build: {context: ., dockerfile: Dockerfile.api}
    env_file: .env
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  worker:
    build: {context: ., dockerfile: Dockerfile.worker}
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args: {NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]

  ollama:
    image: ollama/ollama:latest
    profiles: ["local-ai"]
    volumes: [ollama_data:/root/.ollama]
    ports: ["11434:11434"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
  ollama_data:
