[project]
name = "docmind-api"
version = "0.1.0"
description = "DocMind API and AI domain services"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.128.0",
  "uvicorn[standard]>=0.34.0",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.3",
  "pgvector>=0.3.6",
  "pydantic-settings>=2.7.0",
  "email-validator>=2.2.0",
  "PyJWT>=2.10.1",
  "argon2-cffi>=23.1.0",
  "python-multipart>=0.0.20",
  "boto3>=1.35.0",
  "redis>=5.2.0",
  "celery>=5.4.0",
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
  "pypdf>=5.1.0",
  "PyMuPDF>=1.25.0",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "Pillow>=11.0.0",
  "pytesseract>=0.3.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
  "mypy>=1.14.0",
  "httpx>=0.28.0",
  "jsonschema>=4.23.0",
]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["."]
